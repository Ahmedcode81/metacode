<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#172B4D" />
  <title>GymPro Demo</title>
  <meta name="description" content="GymPro interactive demo — gym management system with members, trainers, payments, and reports." />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css?v=6" />
</head>
<body>
  <div id="login-view" class="login-screen"></div>

  <div id="app-shell" class="app hidden">
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-header">
          <div class="brand">
            <div class="brand-logo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5L17.5 17.5M6.5 17.5L17.5 6.5"/></svg>
            </div>
            <h1 class="brand-name">GymPro</h1>
          </div>
          <button type="button" class="icon-btn" id="sidebar-close" aria-label="Close menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <nav id="sidebar-nav" class="sidebar-nav" aria-label="Main"></nav>

        <div class="sidebar-footer">
          <div class="user-chip">
            <div class="avatar avatar-blue" id="sidebar-avatar">GP</div>
            <div class="user-chip-info">
              <p id="sidebar-user-name">Demo User</p>
              <p id="sidebar-user-role">Super Admin</p>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="topbar-left">
            <button type="button" class="icon-btn" id="sidebar-open" aria-label="Open menu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="page-title">
              <h2 id="page-title">Dashboard</h2>
              <p id="page-section">Main</p>
            </div>
          </div>
          <div class="topbar-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="search" placeholder="Search anything..." aria-label="Search" />
          </div>
          <div class="topbar-right">
            <button type="button" class="avatar-btn" id="header-avatar" aria-label="Account">GP</button>
          </div>
        </div>
      </header>

      <main id="page-content" class="page-content"></main>
    </div>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Mobile"></nav>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <div id="modal-root"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/storage/database.js"></script>
  <script src="../js/storage/seed.js"></script>
  <script src="../js/api/mockApi.js"></script>
  <script src="../js/auth/auth.js"></script>
  <script src="../js/services/attendance.js"></script>
  <script src="../js/services/branches.js"></script>
  <script src="../js/services/classes.js"></script>
  <script src="../js/services/dashboard.js"></script>
  <script src="../js/services/equipment.js"></script>
  <script src="../js/services/inventory.js"></script>
  <script src="../js/services/measurements.js"></script>
  <script src="../js/services/members.js"></script>
  <script src="../js/services/nutrition.js"></script>
  <script src="../js/services/payments.js"></script>
  <script src="../js/services/plans.js"></script>
  <script src="../js/services/pos.js"></script>
  <script src="../js/services/reports.js"></script>
  <script src="../js/services/settings.js"></script>
  <script src="../js/services/trainers.js"></script>
  <script src="../js/services/users.js"></script>
  <script src="../js/services/workout.js"></script>
  <script src="../pages/login.js"></script>
  <script src="../pages/dashboard.js"></script>
  <script src="../pages/members.js"></script>
  <script src="../pages/membership-plans.js"></script>
  <script src="../pages/check-in.js"></script>
  <script src="../pages/trainers.js"></script>
  <script src="../pages/workout-programs.js"></script>
  <script src="../pages/nutrition-plans.js"></script>
  <script src="../pages/body-measurements.js"></script>
  <script src="../pages/group-classes.js"></script>
  <script src="../pages/payments.js"></script>
  <script src="../pages/pos.js"></script>
  <script src="../pages/inventory.js"></script>
  <script src="../pages/equipment.js"></script>
  <script src="../pages/reports.js"></script>
  <script src="../pages/users.js"></script>
  <script src="../pages/branches.js"></script>
  <script src="../pages/settings.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
